[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gov-tenders-mcp"
version = "0.2.0"
description = "Stdio MCP server for government tenders, grants, awards and council meetings via Apify's hosted MCP gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-server", "apify"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "anyio>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gov-tenders-mcp = "gov_tenders_mcp.server:main"

[project.urls]
Homepage = "https://github.com/GeminiGeorge22/gov-tenders-mcp"
Source = "https://github.com/GeminiGeorge22/gov-tenders-mcp/tree/main/python"
Issues = "https://github.com/GeminiGeorge22/gov-tenders-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_tenders_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
